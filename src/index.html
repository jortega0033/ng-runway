<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NgRunway</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Mirrors ThemeService.
      (function () {
        var p = 'system';
        try {
          p = localStorage.getItem('theme') || 'system';
        } catch (e) {}
        var dark =
          p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'theme-dark' : 'theme-light');
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
